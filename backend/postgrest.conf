# Configuración de PostgREST — DE REFERENCIA/DOCUMENTACIÓN.
#
# docker-compose.yml NO usa este archivo: PostgREST no interpola ${VAR} dentro
# de postgrest.conf, así que la configuración real se pasa al contenedor "api"
# como variables de entorno PGRST_* (ver docker-compose.yml), una por cada
# clave listada aquí abajo (db-uri -> PGRST_DB_URI, jwt-secret -> PGRST_JWT_SECRET,
# etc). Este archivo sirve para entender qué significa cada opción, o para un
# despliegue sin Docker donde sí se podría usar directamente sustituyendo los
# valores a mano.

db-uri = "postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB}"

# Único esquema expuesto como API. El esquema "app" (tablas reales, funciones
# internas) NUNCA se expone directamente: todo pasa por vistas/RPC del esquema "api".
db-schemas = "api"

# Rol usado cuando la petición no trae token (sin sesión).
db-anon-role = "web_anon"

# Compatibilidad: expone los claims del JWT como el GUC "request.jwt.claims"
# (usado por app.current_profesional_id() / app.current_rol() en el SQL).
db-use-legacy-gucs = true

# Secreto simétrico HS256 para validar los JWT firmados por api.login().
#
# MIGRACIÓN A COGNITO: cuando el User Pool esté disponible, reemplazar estas dos
# líneas por la validación RS256 contra el JWKS de Cognito, por ejemplo:
#   jwt-secret = "https://cognito-idp.<region>.amazonaws.com/<userPoolId>/.well-known/jwks.json"
#   jwt-secret-is-base64 = false
# PostgREST soporta URLs de JWKS directamente en "jwt-secret" desde v9+.
# El resto de la configuración (roles, RLS, vistas de "api") no cambia.
jwt-secret = "${APP_JWT_SECRET}"
jwt-secret-is-base64 = false

# Límite defensivo: ninguna consulta puede traer más de 1000 filas sin paginar.
db-max-rows = 1000

server-port = 3000
server-host = "*"

# Logs razonables para desarrollo; bajar a "error" en producción.
log-level = "info"
